server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: takeaseat-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/BookASeat_DB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    # Base64-encoded 256-bit+ secret (override via JWT_SECRET in production)
    secret: ${JWT_SECRET:VGVzdFNlY3JldEtleUZvclRha2VBU2VhdFBsYXRmb3JtMjAyNlNlY3VyZUpXVFNpZ25pbmdLZXk=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seat-lock:
    ttl-seconds: 600
  storage:
    local-dir: ${LOCAL_TICKET_DIR:./uploads/tickets}
    posters-dir: ${LOCAL_POSTER_DIR:./uploads/posters}

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:false}
    bucket: ${AWS_S3_BUCKET:takeaseat-tickets}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

logging:
  level:
    com.takeaseat: INFO
